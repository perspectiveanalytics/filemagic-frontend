types {
    application/javascript  mjs;
}

server {
    listen 8080;
    server_name filemagic.app;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API proxy — only for E2E tests from the CI runner.
    # Production traffic uses api.filemagic.app via Cloudflare Tunnel.
    location /api/ {
        include /etc/nginx/allowed_ips.conf;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://host.docker.internal:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 360m;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so chunk references are always fresh after deploy.
        # Hashed assets are handled by the /assets/ block above.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
