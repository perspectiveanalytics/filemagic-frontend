types {
    application/javascript  mjs;
}

server {
    listen 8080;
    server_name www.filemagic.app;
    absolute_redirect off;

    return 301 https://filemagic.app$request_uri;
}

server {
    listen 8080 default_server;
    server_name filemagic.app;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed assets are immutable
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ~ ^/split/pdf/?$ {
        return 301 /edit/pdf/;
    }

    location ~ ^/fr/split/pdf/?$ {
        return 301 /fr/edit/pdf/;
    }

    location ~ ^/convert/pdf-rotate/?$ {
        return 301 /edit/pdf/;
    }

    location ~ ^/fr/convert/pdf-rotate/?$ {
        return 301 /fr/edit/pdf/;
    }

    location ~ ^/convert/svg-to-png/?$ {
        return 301 /convert/image/;
    }

    location ~ ^/fr/convert/svg-to-png/?$ {
        return 301 /fr/convert/image/;
    }

    location ~ ^/convert/markdown/pdf/?$ {
        return 301 /convert/markdown-pdf/;
    }

    location ~ ^/fr/convert/markdown/pdf/?$ {
        return 301 /fr/convert/markdown-pdf/;
    }

    location ~ ^/convert/audio/extract/?$ {
        return 301 /convert/audio-extract/;
    }

    location ~ ^/fr/convert/audio/extract/?$ {
        return 301 /fr/convert/audio-extract/;
    }

    location ~ ^/tools/hash-generator/?$ {
        return 301 /tools/hash/;
    }

    location ~ ^/fr/tools/hash-generator/?$ {
        return 301 /fr/tools/hash/;
    }

    # API proxy — only for E2E tests from the CI runner.
    # Production traffic uses api.filemagic.app via Cloudflare Tunnel.
    location ^~ /api/ {
        include /etc/nginx/allowed_ips.conf;
        allow 127.0.0.1;
        deny all;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $filemagic_api_backend http://host.docker.internal:8090;
        proxy_pass $filemagic_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
    }

    error_page 404 /404.html;

    location = /404.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Canonicalize directory routes to Astro's trailing-slash URLs.
    location ~ ^(.+[^/])$ {
        if (-d $document_root$uri) {
            return 301 $uri/$is_args$args;
        }

        try_files $uri $uri/ =404;
        # Prevent caching of HTML so chunk references are always fresh after deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Static Astro routes. Unknown URLs must stay 404 to avoid soft-indexing.
    location / {
        try_files $uri $uri/ =404;
        # Prevent caching of HTML so chunk references are always fresh after deploy.
        # Hashed assets are handled by the /assets/ block above.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
